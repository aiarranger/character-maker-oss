[package]
name = "gyogun-game"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gyogun"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim = { path = "../sim" }
# キャラの部品は characters の crates から（node <characters>/scripts/game-parts.mjs --to <このゲーム> --write が vendor/rust へ写す）
character-actor = { path = "../../vendor/rust/character-actor" }
character-view = { path = "../../vendor/rust/character-view" }
game-ui = { path = "../../vendor/rust/game-ui" }
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gilrs = "0.11"
web-time = "1"

# Mac で直接動かす版
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
egui-winit = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "mp4"] }
symphonia = { version = "0.5", default-features = false, features = ["isomp4"] }
rusty-opus = "1.0.2"

# ブラウザで動く版（docs/rust-port.md）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "console", "Window", "Document", "Element", "HtmlCanvasElement", "Location", "Storage", "Performance", "MediaQueryList",
  "HtmlMediaElement", "HtmlAudioElement", "MediaElementAudioSourceNode", "AddEventListenerOptions",
  "Response", "Event", "EventTarget", "KeyboardEvent", "Navigator", "Gamepad", "GamepadButton",
  "AudioContext", "AudioContextState", "AudioNode", "AudioParam", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode",
  "GainNode", "OscillatorNode", "OscillatorType", "BiquadFilterNode", "BiquadFilterType", "DynamicsCompressorNode", "AudioScheduledSourceNode", "BaseAudioContext",
] }
