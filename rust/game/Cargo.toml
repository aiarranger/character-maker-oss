[package]
name = "character-maker-stage"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 土台とキャラの部品は characters の crates から（node <characters>/scripts/game-parts.mjs --to <このリポジトリ> --rust <crate,…> --write が vendor/rust へ写す）。
# キャラメイクの模型（組み立て・設定・動き）はこの crate の物で、主役・NPC の部品とは分ける（docs/rust-stage-plan.md）
island-kit = { path = "../../vendor/rust/island-kit" }
character-actor = { path = "../../vendor/rust/character-actor" }
wgpu = "30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG の服の配色（character-actor が同じ版・同じ機能で使う物）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "HtmlCanvasElement"] }
