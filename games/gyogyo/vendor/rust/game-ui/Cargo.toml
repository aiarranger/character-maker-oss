[package]
name = "game-ui"
version = "0.5.1"
edition = "2024"
description = "ゲームの画面の文字・枠を egui で描く共通部品（muso から切り出し）。ブラウザとネイティブで同じ描き方"

[dependencies]
wgpu = "30"
winit = "0.30"
egui = "0.36"
# 既定の機能は wgpu/webgl を入れ、wasm に使わない WebGL の層（wgpu-core・naga）が数 MB 入る。ゲームは WebGPU だけ（無ければ旧版へ）
egui-wgpu = { version = "0.36", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.36", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "HtmlCanvasElement", "PointerEvent", "MouseEvent", "WheelEvent", "TouchEvent", "TouchList", "Touch", "Window", "Document", "Element", "HtmlElement", "Node", "CssStyleDeclaration", "Response", "MediaQueryList", "Location"] }
